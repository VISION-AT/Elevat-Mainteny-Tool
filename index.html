<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Aufzugtechnik - Dynamischer Planer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 15px; }
        .app-container { max-width: 650px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        h2 { color: #0078d4; text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; color: #888; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .time-banner { background: #0078d4; padding: 15px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .time-val { font-size: 2.5em; font-weight: bold; display: block; }
        .module-card { background: #252525; border-left: 5px solid #0078d4; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .module-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; color: #0078d4; }
        .task-list { margin: 0; padding: 0; list-style: none; }
        .task-item { margin-bottom: 10px; font-size: 0.9em; color: #eee; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; justify-content: space-between; }
        .task-name { flex: 1; padding-right: 10px; line-height: 1.4; }
        .task-time { color: #00ff00; font-weight: bold; white-space: nowrap; }
        .mail-btn { background: #0078d4; color: white; text-align: center; padding: 18px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; margin-top: 25px; border: none; width: 100%; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Vision Wartungs-Tool</h2>
    
    <div class="input-group">
        <label>Anlage / Standort (wird automatisch ermittelt):</label>
        <input type="text" id="location" placeholder="Suche Standort...">
    </div>

    <div class="input-group">
        <label>Anzahl Stockwerke:</label>
        <input type="number" id="floors" value="4" min="1" oninput="updateApp()">
    </div>

    <div class="input-group">
        <label>Nutzlast (kg):</label>
        <input type="number" id="payload" value="630" min="100" oninput="updateApp()">
    </div>

    <div class="input-group">
        <label>Wartungs-Intervall:</label>
        <select id="interval" onchange="updateApp()">
            <option value="1">1x jährlich (Vollwartung)</option>
            <option value="2" selected>2x jährlich</option>
            <option value="4">4x jährlich</option>
        </select>
    </div>

    <div id="visit-box" class="input-group" style="display:none;">
        <label>Besuch wählen:</label>
        <select id="visit" onchange="updateApp()"></select>
    </div>

    <div class="time-banner">
        <span style="font-size: 0.9em; opacity: 0.9;">Netto-Sollzeit vor Ort</span>
        <span class="time-val"><span id="totalTime">0</span> Min.</span>
    </div>

    <div id="checklist"></div>

    <button onclick="sendMail()" class="mail-btn">Protokoll an Büro senden</button>
</div>

<script>
    const data = {
        A: { title: "Modul A: Triebwerk & Steuerung", tasks: [
            { n: "Triebwerk / Antrieb: Dichtheit, Geräusche, Ölstand.", t: 15, scale: true },
            { n: "Bremse: Lüftspiel, Justierung & Belag-Kontrolle.", t: 12, scale: false },
            { n: "Seile / Aufhängung: Spannung, Schlösser, Rollen.", t: 13, scale: false },
            { n: "Steuerung: Prüfung Relais, Schütze, Platinen.", t: 10, scale: false }
        ]},
        B: { title: "Modul B: Schacht & Sicherheit", tasks: [
            { n: "Geschwindigkeitsbegrenzer: Funktionskontrolle.", t: 10, scale: false },
            { n: "Führungsschienen: Verschleiß prüfen & schmieren.", t: 15, scale: true },
            { n: "Schacht: Schienenbefestigung & Stützen-Reinigung.", t: 10, scale: true },
            { n: "Notbefreiung: Manuell/auto inkl. Akkus prüfen.", t: 5, scale: false }
        ]},
        C: { title: "Modul C: Kabine & Notruf", tasks: [
            { n: "Fahrkorbtüren: Antrieb reinigen/schmieren & Lichtgitter.", 20, scale: true },
            { n: "Kabine innen: Beleuchtung, Taster, Anzeigen.", 10, scale: true },
            { n: "Kabinendach: Reinigung, Inspektionssteuerung, Fang-Kontakt.", 10, scale: true },
            { n: "Notruf: Zwei-Wege-Kommunikation prüfen.", 10, scale: false }
        ]},
        D: { title: "Modul D: Etagen & Grube", tasks: [
            { n: "Schachttüren: Reinigen/Schmieren & Kontakte (je Stock).", t: 5.5, scale: true, perFloor: true },
            { n: "Haltestellen: Taster, Anzeigen & Pfeile (je Stock).", t: 1, scale: false, perFloor: true },
            { n: "Schachtgrube: Reinigung, Puffer & Endschalter.", t: 14, scale: true }
        ]}
    };

    function updateApp() {
        const floors = parseInt(document.getElementById('floors').value) || 0;
        const interval = parseInt(document.getElementById('interval').value);
        const payload = parseInt(document.getElementById('payload').value) || 630;
        const visitSel = document.getElementById('visit');
        
        const factor = 1 + (Math.max(0, payload - 630) / 5000);

        document.getElementById('visit-box').style.display = (interval > 1) ? 'block' : 'none';
        if (visitSel.options.length !== interval) {
            visitSel.innerHTML = "";
            for(let i=1; i<=interval; i++) {
                let o = document.createElement('option'); o.value = i; o.text = "Besuch " + i;
                visitSel.add(o);
            }
        }

        const visit = parseInt(visitSel.value) || 1;
        let activeKeys = (interval === 1) ? ['A', 'B', 'C', 'D'] : 
                         (interval === 2) ? (visit === 1 ? ['A', 'B'] : ['C', 'D']) : 
                         [['A'], ['B'], ['C'], ['D']][visit-1];

        let total = 0;
        let html = "";

        activeKeys.forEach(k => {
            const m = data[k];
            let mTime = 0;
            let listHtml = "";

            m.tasks.forEach(task => {
                let tTime = task.t;
                if (task.scale) tTime *= factor;
                if (task.perFloor) tTime *= floors;
                tTime = Math.round(tTime);
                mTime += tTime;
                listHtml += `<li class="task-item"><span class="task-name">${task.n}</span><span class="task-time">${tTime} Min</span></li>`;
            });

            total += mTime;
            html += `<div class="module-card">
                <div class="module-header"><span>${m.title}</span><span>${mTime} Min</span></div>
                <ul class="task-list">${listHtml}</ul>
            </div>`;
        });

        if (interval === 4 && visit === 3) {
            let bonus = Math.round(20 * factor);
            total += bonus;
            html += `<div class="module-card" style="border-left-color: #ffaa00;">
                <div class="module-header"><span>Jahresschmierung & Intensiv-Reinigung</span><span>${bonus} Min</span></div>
                <ul class="task-list"><li class="task-item">Schienen ölen, Türführungen fetten, Grube & Dach saugen.</li></ul>
            </div>`;
        }
        document.getElementById('totalTime').innerText = total;
        document.getElementById('checklist').innerHTML = html;
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.display_name) {
                            document.getElementById('location').value = data.display_name;
                        }
                    })
                    .catch(() => {
                        document.getElementById('location').value = "Standort konnte nicht ermittelt werden";
                    });
            });
        }
    }

    function sendMail() {
        const loc = document.getElementById('location').value || "Dornbirn";
        const fl = document.getElementById('floors').value;
        const pay = document.getElementById('payload').value;
        const vis = document.getElementById('visit').value || 1;
        const int = document.getElementById('interval').value;
        
        let body = `WARTUNGSPROTOKOLL%0A--------------------------------%0AStandort: ${loc}%0AStockwerke: ${fl}%0ANutzlast: ${pay} kg%0AIntervall: ${int}x jährlich (Besuch ${vis})%0A%0ADurchgeführte Arbeiten:%0A`;
        
        document.querySelectorAll('.module-card').forEach(card => {
            const title = card.querySelector('.module-header span').innerText;
            body += `%0A[X] ${title}%0A`;
            card.querySelectorAll('.task-item .task-name').forEach(task => {
                body += `- ${task.innerText}%0A`;
            });
        });

        window.location.href = `mailto:info@vision-aufzugtechnik.at?subject=Protokoll ${loc}&body=${body}`;
    }

    window.onload = function() {
        getLocation();
        updateApp();
    };
</script>
</body>
</html>
