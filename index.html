<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungs-Check</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid #333; }
        h2 { color: #0078d4; margin-top: 0; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .result-box { background: #0078d4; padding: 15px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .total-time { font-size: 2em; font-weight: bold; }
        .wa-button { background: #25D366; color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; margin-top: 10px; }
        .module { font-size: 0.85em; color: #bbb; border-bottom: 1px solid #333; padding: 8px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h2>Wartungs-Vorgabe</h2>
    <label>Anzahl Etagen:</label>
    <input type="number" id="floors" value="5" oninput="calculate()">
    
    <label>Intervall:</label>
    <select id="interval" onchange="calculate()">
        <option value="1">1x jährlich</option>
        <option value="2">2x jährlich</option>
        <option value="4" selected>4x jährlich (Intensiv)</option>
    </select>

    <div class="result-box">
        <div>Vorgabezeit pro Besuch:</div>
        <div class="total-time"><span id="total">0</span> Min.</div>
    </div>

    <div id="breakdown"></div>

    <a href="#" id="whatsapp" class="wa-button">Ergebnis per WhatsApp senden</a>
</div>

<script>
    function calculate() {
        const f = parseInt(document.getElementById('floors').value) || 0;
        const i = parseInt(document.getElementById('interval').value);
        
        const tEngine = Math.round(40/i);
        const tFloors = Math.round((f*8)/i);
        const tCar = Math.round(20/i);
        const tExtra = (i === 4) ? 20 : 0;
        const total = 15 + tEngine + tFloors + tCar + tExtra;

        document.getElementById('total').innerText = total;
        
        const text = `Wartung abgeschlossen:%0A- Etagen: ${f}%0A- Intervall: ${i}x%0A- Zeit: ${total} Min.`;
        document.getElementById('whatsapp').href = `https://wa.me/?text=${text}`;
        
        document.getElementById('breakdown').innerHTML = `
            <div class="module"><span>Basis/Vorbereitung</span><span>15 Min</span></div>
            <div class="module"><span>Antrieb/Steuerung</span><span>${tEngine} Min</span></div>
            <div class="module"><span>Türen/Etagen</span><span>${tFloors} Min</span></div>
            ${tExtra > 0 ? `<div class="module"><span>Zusatz Reinigung</span><span>20 Min</span></div>` : ''}
        `;
    }
    calculate();
</script>
</body>
</html>
