<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Aufzugtechnik - Experten-Planer</title>
    <style>
        :root {
            --vision-blue: #00A8E8;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #ffffff;
            --accent-green: #00ff00;
            --accent-orange: #ffaa00;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-light); padding: 15px; }
        .app-container { max-width: 650px; margin: auto; background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,168,232, 0.2); }
        h2 { color: var(--vision-blue); text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .time-banner { background: linear-gradient(135deg, var(--vision-blue), #0077a3); padding: 20px; border-radius: 8px; text-align: center; margin: 25px 0; }
        .time-val { font-size: 3em; font-weight: bold; display: block; }
        .module-card { background: #252525; border-left: 5px solid var(--vision-blue); padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .module-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; color: var(--vision-blue); }
        .task-list { margin: 0; padding: 0; list-style: none; }
        .task-item { margin-bottom: 10px; font-size: 0.9em; border-bottom: 1px solid #333; padding-bottom: 8px; display: flex; justify-content: space-between; }
        .task-name { flex: 1; padding-right: 10px; }
        .task-time { color: var(--accent-green); font-weight: bold; }
        .mail-btn { background: var(--vision-blue); color: white; text-align: center; padding: 18px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; margin-top: 25px; border: none; width: 100%; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Vision Wartungs-Tool</h2>
    <div class="input-group">
        <label>Anlage / Standort:</label>
        <input type="text" id="location" placeholder="Ortet Standort...">
    </div>
    <div class="input-group">
        <label>Anzahl Stockwerke:</label>
        <input type="number" id="floors" value="4" min="1" oninput="updateApp()">
    </div>
    <div class="input-group">
        <label>Nutzlast (kg):</label>
        <input type="number" id="payload" value="630" min="100" oninput="updateApp()">
    </div>
    <div class="input-group">
        <label>Anzahl Türantriebe (Fahrkorb):</label>
        <select id="doorSides" onchange="updateApp()">
            <option value="1">1 Antrieb (Standard)</option>
            <option value="2">2 Antriebe (Durchlader)</option>
            <option value="3">3 Antriebe</option>
            <option value="4">4 Antriebe</option>
        </select>
    </div>
    <div class="input-group">
        <label>Wartungs-Intervall:</label>
        <select id="interval" onchange="updateApp()">
            <option value="1">1x jährlich (Module A-D)</option>
            <option value="2" selected>2x jährlich</option>
            <option value="4">4x jährlich</option>
        </select>
    </div>
    <div id="visit-box" class="input-group">
        <label>Besuch wählen:</label>
        <select id="visit" onchange="updateApp()"></select>
    </div>
    <div class="time-banner">
        <span style="font-size: 0.9em; opacity: 0.9;">Netto-Sollzeit vor Ort</span>
        <span class="time-val"><span id="totalTime">0</span> Min.</span>
    </div>
    <div id="checklist"></div>
    <button onclick="sendMail()" class="mail-btn">Vollständiges Protokoll an Büro senden</button>
</div>

<script>
    const data = {
        A: { title: "Modul A: Triebwerk & Steuerung", tasks: [
            { n: "Triebwerk / Antrieb: Dichtheit, Geräusche, Ölstand.", t: 8, scale: true },
            { n: "Bremse: Lüftspiel, Justierung & Belag-Kontrolle.", t: 5, scale: false },
            { n: "Seile / Aufhängung: Spannung, Schlösser, Rollen.", t: 5, scale: false },
            { n: "Steuerung: Prüfung Relais, Schütze, Platinen.", t: 4, scale: false }
        ]},
        B: { title: "Modul B: Schacht & Sicherheit", tasks: [
            { n: "Geschwindigkeitsbegrenzer: Funktionskontrolle.", t: 4, scale: false },
            { n: "Führungsschienen: Verschleiß prüfen & schmieren.", t: 6, scale: true },
            { n: "Schacht: Schienenbefestigung & Stützen-Reinigung.", t: 5, scale: true },
            { n: "Notbefreiung: Manuell/auto inkl. Akkus prüfen.", t: 3, scale: false }
        ]},
        C: { title: "Modul C: Kabine & Notruf", tasks: [
            { n: "Fahrkorbtüren: Antrieb reinigen/schmieren & Lichtgitter.", t: 7, scale: true, isDrive: true },
            { n: "Kabine innen: Beleuchtung, Taster, Anzeigen.", t: 4, scale: true },
            { n: "Kabinendach: Reinigung, Inspektionssteuerung, Fang-Kontakt.", t: 5, scale: true },
            { n: "Notruf: Zwei-Wege-Kommunikation prüfen.", t: 4, scale: false }
        ]},
        D: { title: "Modul D: Etagen & Grube", tasks: [
            { n: "Schachttüren: Reinigen/Schmieren & Kontakte (je Stock).", t: 4, scale: true, perFloor: true },
            { n: "Haltestellen: Taster, Anzeigen & Pfeile (je Stock).", t: 1, scale: false, perFloor: true },
            { n: "Schachtgrube: Reinigung, Puffer & Endschalter.", t: 10, scale: true }
        ]}
    };

    function updateApp() {
        const floors = parseInt(document.getElementById('floors').value) || 1;
        const interval = parseInt(document.getElementById('interval').value);
        const payload = parseInt(document.getElementById('payload').value) || 630;
        const doorSides = parseInt(document.getElementById('doorSides').value) || 1;
        const visitSel = document.getElementById('visit');
        const factor = 1 + (Math.max(0, payload - 630) / 5000);
        
        document.getElementById('visit-box').style.display = (interval > 1) ? 'block' : 'none';
        if (visitSel.options.length !== interval) {
            visitSel.innerHTML = "";
            for(let i=1; i<=interval; i++) {
                let o = document.createElement('option'); o.value = i; o.text = "Besuch " + i;
                visitSel.add(o);
            }
        }

        const visit = parseInt(visitSel.value) || 1;
        const currentKeys = (interval === 1) ? ['A', 'B', 'C', 'D'] : (interval === 2) ? (visit === 1 ? ['A', 'B'] : ['C', 'D']) : [['A'], ['B'], ['C'], ['D']][visit-1];

        let total = 0;
        if (interval === 1) total -= 1; 
        if (interval === 4) total += 10;

        let html = "";
        currentKeys.forEach(k => {
            const m = data[k];
            let mTime = 0;
            let listHtml = "";
            m.tasks.forEach(task => {
                let tTime = task.t;
                if (task.isDrive) tTime *= doorSides; // Nur Fahrkorbantrieb skaliert [cite: 2025-05-27]
                if (task.scale) tTime *= factor;
                if (task.perFloor) tTime *= floors;
                if (interval === 4) tTime *= 0.7;
                tTime = Math.round(tTime);
                mTime += tTime;
                listHtml += `<li class="task-item"><span class="task-name">${task.n}</span><span class="task-time">${tTime} Min</span></li>`;
            });
            total += mTime;
            html += `<div class="module-card"><div class="module-header"><span>${m.title}</span><span>${mTime} Min</span></div><ul class="task-list">${listHtml}</ul></div>`;
        });

        if (interval === 4 && visit === 3) {
            let bonus = Math.round(15 * factor * doorSides);
            total += bonus;
            html += `<div class="module-card" style="border-left-color: var(--accent-orange);"><div class="module-header" style="color: var(--accent-orange);"><span>E-Modul: Zusatzarbeiten</span><span>${bonus} Min</span></div><ul class="task-list"><li class="task-item">Schmieren bewegliche Teile und Türrollen, Türen reinigen.</li></ul></div>`;
        }
        document.getElementById('totalTime').innerText = total;
        document.getElementById('checklist').innerHTML = html;
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}`)
                    .then(res => res.json()).then(d => { if(d.display_name) document.getElementById('location').value = d.display_name; });
            }, () => {}, {timeout: 5000});
        }
    }

    function sendMail() {
        const loc = document.getElementById('location').value || "Dornbirn";
        const fl = document.getElementById('floors').value;
        const pay = document.getElementById('payload').value;
        const ds = document.getElementById('doorSides').value;
        const int = document.getElementById('interval').value;
        const vis = document.getElementById('visit').value || 1;
        
        let mailBody = `WARTUNGSPROTOKOLL%0A--------------------------------%0AStandort: ${loc}%0AStockwerke: ${fl}%0ANutzlast: ${pay} kg%0ATürantriebe: ${ds}%0AIntervall: ${int}x jährlich (Besuch ${vis})%0A%0ADurchgeführte Arbeiten:%0A`;
        
        const currentKeys = (int == 1) ? ['A', 'B', 'C', 'D'] : (int == 2) ? (vis == 1 ? ['A', 'B'] : ['C', 'D']) : [['A'], ['B'], ['C'], ['D']][vis-1];

        currentKeys.forEach(k => {
            const mod = data[k];
            mailBody += `%0A[X] ${mod.title}%0A`;
            mod.tasks.forEach(t => { mailBody += `- ${t.n}%0A`; });
        });

        if (int == 4 && vis == 3) mailBody += `%0A[X] Zusatz: Schmieren bewegliche Teile und Türrollen, Türen reinigen%0A`;

        window.location.href = `mailto:info@vision-aufzugtechnik.at?subject=Protokoll ${loc}&body=${mailBody}`;
    }

    window.onload = () => { getLocation(); updateApp(); };
</script>
</body>
</html>
