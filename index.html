<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungs-Profi EN 13015</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 15px; }
        .app-container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h2 { color: #0078d4; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; color: #888; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .time-banner { background: #0078d4; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .time-val { font-size: 2.8em; font-weight: bold; display: block; }
        .module-card { background: #252525; border-left: 5px solid #0078d4; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .module-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
        .task-list { margin: 0; padding-left: 0; list-style: none; font-size: 0.9em; color: #ccc; }
        .task-item { margin-bottom: 8px; display: flex; justify-content: space-between; }
        .task-time { color: #00ff00; font-size: 0.8em; }
        .mail-btn { background: #0078d4; color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; margin-top: 20px; border: none; width: 100%; cursor: pointer; font-size: 16px; }
        .bonus-card { border-left-color: #ffaa00; background: #2a2212; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>EN 13015 Wartungsplaner</h2>
    
    <div class="input-group">
        <label>Anlage / Standort (optional):</label>
        <input type="text" id="location" placeholder="z.B. Bachmähdle 37">
    </div>

    <div class="input-group">
        <label>Anzahl Stockwerke:</label>
        <input type="number" id="floors" value="5" oninput="updateApp()">
    </div>

    <div class="input-group">
        <label>Vertrags-Intervall:</label>
        <select id="interval" onchange="updateApp()">
            <option value="1">1x jährlich (Gesamt)</option>
            <option value="2">2x jährlich</option>
            <option value="4">4x jährlich</option>
        </select>
    </div>

    <div id="visit-box" class="input-group" style="display:none;">
        <label>Aktueller Termin:</label>
        <select id="visit" onchange="updateApp()"></select>
    </div>

    <div class="time-banner">
        <span>Interne Zeitvorgabe</span>
        <span class="time-val"><span id="totalTime">0</span> Min.</span>
    </div>

    <div id="checklist"></div>

    <button onclick="sendMail()" class="mail-btn">Protokoll per E-Mail senden</button>
</div>

<script>
    const data = {
        A: { title: "Modul A: Antrieb & Reinigung", base: 30, tasks: [
            ["Treibscheibe/Seile prüfen", 10], ["Bremse prüfen/lüften", 10], ["Motor/Getriebe reinigen/prüfen", 10]
        ]},
        B: { title: "Modul B: Schacht & Grube", base: 25, tasks: [
            ["Beleuchtung/Not-Halt prüfen", 6], ["Begrenzer/Puffer prüfen", 10], ["Grube/Schienen prüfen", 9]
        ]},
        C: { title: "Modul C: Fahrkorb & Kabinentüre", base: 25, tasks: [
            ["Notruf/Sprechstelle prüfen", 5], ["Lichtgitter/Türreversierung", 10], ["Türantrieb Kabine reinigen/prüfen", 10]
        ]},
        D: { title: "Modul D: Schachttüren", base: 0, tasks: [
            ["Türkontakte/Verriegelung prüfen", 2], ["Rollen/Schließer prüfen", 2], ["Notentrieg./Schwelle reinigen", 1]
        ]}
    };

    function updateApp() {
        const floors = parseInt(document.getElementById('floors').value) || 0;
        const interval = parseInt(document.getElementById('interval').value);
        const visitSel = document.getElementById('visit');
        document.getElementById('visit-box').style.display = (interval > 1) ? 'block' : 'none';

        if (visitSel.options.length !== interval) {
            visitSel.innerHTML = "";
            for(let i=1; i<=interval; i++) {
                let o = document.createElement('option'); o.value = i; o.text = "Besuch " + i;
                visitSel.add(o);
            }
        }

        const visit = parseInt(visitSel.value) || 1;
        let activeKeys = [];
        if (interval === 1) activeKeys = ['A', 'B', 'C', 'D'];
        else if (interval === 2) activeKeys = (visit === 1) ? ['A', 'B'] : ['C', 'D'];
        else activeKeys = [['A'], ['B'], ['C'], ['D']][visit-1];

        let total = 0;
        let html = "";

        activeKeys.forEach(k => {
            const m = data[k];
            let mTime = (k === 'D') ? floors * 5 : m.base;
            total += mTime;
            html += `<div class="module-card">
                <div class="module-header"><span>${m.title}</span><span>${mTime} Min</span></div>
                <ul class="task-list">${m.tasks.map(t => `<li class="task-item"><span>${t[0]}</span><span class="task-time">${k==='D' ? t[1]*floors : t[1]} Min</span></li>`).join('')}</ul>
            </div>`;
        });

        if (interval === 4 && visit === 3) {
            total += 20;
            html += `<div class="module-card bonus-card">
                <div class="module-header"><span>Zusatz: Intensiv-Schmierung & Reinigung</span><span>20 Min</span></div>
                <div class="task-list">Führungsschienen ölen, Türführungen intensiv fetten, Schachtgrube komplett saugen.</div>
            </div>`;
        }
        document.getElementById('totalTime').innerText = total;
        document.getElementById('checklist').innerHTML = html;
    }

    function sendMail() {
        const location = document.getElementById('location').value || "unbekannt";
        const floors = document.getElementById('floors').value;
        const interval = document.getElementById('interval').value;
        const visit = document.getElementById('visit').value || 1;
        
        let protocolText = `Wartungsprotokoll EN 13015%0A--------------------------------%0AAnlage: ${location}%0AStockwerke: ${floors}%0AIntervall: ${interval}x jährlich%0ABesuch: ${visit}%0A%0ADurchgeführte Arbeiten:%0A`;
        
        const activeCards = document.querySelectorAll('.module-card');
        activeCards.forEach(card => {
            const title = card.querySelector('.module-header span').innerText;
            protocolText += `%0A[X] ${title}%0A`;
            const tasks = card.querySelectorAll('.task-item span:first-child');
            tasks.forEach(task => {
                protocolText += `- ${task.innerText}%0A`;
            });
        });

        const mailto = `mailto:info@vision-aufzugtechnik.at?subject=Wartungsprotokoll ${location}&body=${protocolText}`;
        window.location.href = mailto;
    }

    updateApp();
</script>
</body>
</html>
