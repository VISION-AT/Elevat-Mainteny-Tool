<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techniker-Vorgabe & Checkliste</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2, h3 { color: #0078d4; border-bottom: 2px solid #333; padding-bottom: 8px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: white; margin-bottom: 10px; }
        .summary { background: #0078d4; color: white; padding: 15px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .total-time { font-size: 2.2em; font-weight: bold; }
        .module-box { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #0078d4; }
        .module-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; margin-bottom: 8px; padding-bottom: 4px; }
        ul { margin: 5px 0; padding-left: 20px; color: #bbb; font-size: 0.9em; }
        li { margin-bottom: 4px; }
        .highlight { color: #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <h2>Wartungs-Vorgabe</h2>
    
    <label>Etagen:</label>
    <input type="number" id="floors" value="5" oninput="calculate()">

    <label>Besuch-Rhythmus:</label>
    <select id="interval" onchange="calculate()">
        <option value="1">1x jährlich (Basis-Check)</option>
        <option value="2">2x jährlich (Standard)</option>
        <option value="4" selected>4x jährlich (Intensiv / Modulwartung)</option>
    </select>

    <div class="summary">
        <div>Soll-Arbeitszeit vor Ort</div>
        <div class="total-time"><span id="total">0</span> Min.</div>
    </div>

    <div id="modules-container">
        </div>
</div>

<script>
    function calculate() {
        const floors = parseInt(document.getElementById('floors').value) || 0;
        const interval = parseInt(document.getElementById('interval').value);
        const container = document.getElementById('modules-container');
        container.innerHTML = "";

        // Basis-Daten
        const modules = [
            { name: "Vorbereitung", time: 15, tasks: ["Anmeldung/Hauswart", "Absperrung Etage", "Fahrschacht-Check"] },
            { name: "Antrieb & Steuerung", time: Math.round(40/interval), tasks: ["Ölstand prüfen", "Bremslüftung", "Schaltschrank saugen"] },
            { name: "Türen & Etagen", time: Math.round((floors * 8)/interval), tasks: ["Türkontakte prüfen", "Schwellenreinigung", "Tableaus Test"] },
            { name: "Fahrkorb & Fang", time: Math.round(20/interval), tasks: ["Notruf-Test", "Lichtgitter", "Fangvorrichtung Sichtprüfung"] }
        ];

        let total = 0;

        modules.forEach(m => {
            total += m.time;
            container.innerHTML += `
                <div class="module-box">
                    <div class="module-header"><span>${m.name}</span> <span class="highlight">${m.time} Min</span></div>
                    <ul>${m.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
                </div>`;
        });

        // Spezielles Modul für 4x Wartung
        if (interval == 4) {
            const extraTime = 20;
            total += extraTime;
            container.innerHTML += `
                <div class="module-box" style="border-left-color: #ffaa00;">
                    <div class="module-header"><span>Intensiv-Reinigung & Fett</span> <span class="highlight">${extraTime} Min</span></div>
                    <ul>
                        <li>Führungsschienen schmieren</li>
                        <li>Schachtgrube intensiv reinigen</li>
                        <li>Türrollen nachstellen/fetten</li>
                    </ul>
                </div>`;
        }

        document.getElementById('total').innerText = total;
    }
    calculate();
</script>

</body>
</html>
